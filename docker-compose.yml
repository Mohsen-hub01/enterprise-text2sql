services:
  api:
    build: .
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://text2sql_reader:reader_password@postgres:5432/analytics
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert response['status'] == 'healthy' and response['database']"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: text2sql-postgres

    environment:
      POSTGRES_USER: text2sql
      POSTGRES_PASSWORD: text2sql
      POSTGRES_DB: analytics

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
